name: CD

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Stable semantic version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: npm-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Commit and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate dispatch from current main
        id: base
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          test "$DISPATCH_REF" = "refs/heads/main"

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

          base_sha="$(git rev-parse HEAD)"
          remote_main_sha="$(git rev-parse refs/remotes/origin/main)"

          test "$base_sha" = "$remote_main_sha"

          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare release metadata
        id: metadata
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          release_date="$(date -u +%F)"
          git tag --list | bun scripts/release-metadata.ts \
            --package-json package.json \
            --changelog CHANGELOG.md \
            --bump "$BUMP" \
            --date "$release_date"

      - name: Run release checks
        run: bun run release:check

      - name: Pack release
        id: pack
        run: |
          set -euo pipefail
          package_directory="$RUNNER_TEMP/opencode-vpet-package"
          mkdir -p "$package_directory"

          tarball_name="$(npm pack --loglevel silent --ignore-scripts \
            --pack-destination "$package_directory")"

          test -f "$package_directory/$tarball_name"

          printf 'tarball_name=%s\n' "$tarball_name" >> "$GITHUB_OUTPUT"

      - name: Commit and tag release
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
        run: |
          set -euo pipefail

          git add package.json CHANGELOG.md

          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(release): v$RELEASE_VERSION"

          git tag -a "v$RELEASE_VERSION" -m "v$RELEASE_VERSION"

      - name: Commit next version
        env:
          NEXT_DEV_VERSION: ${{ steps.metadata.outputs.next_dev_version }}
        run: |
          set -euo pipefail

          bun scripts/release-metadata.ts set-package-version package.json "$NEXT_DEV_VERSION"

          git add package.json

          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: start $NEXT_DEV_VERSION"

      - name: Push release
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/v$RELEASE_VERSION"

      - name: Publish release (npm)
        env:
          TARBALL: ${{ runner.temp }}/opencode-vpet-package/${{ steps.pack.outputs.tarball_name }}
        run: |
          set -euo pipefail

          npm_version="$(npm --version)"

          NPM_VERSION="$npm_version" node --input-type=module <<'NODE'
          const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number);
          if (
            major < 11 ||
            (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))
          ) {
            throw new Error(`npm ${process.env.NPM_VERSION} is below required version 11.5.1`);
          }
          NODE

          npm publish "$TARBALL" \
            --access public --provenance --ignore-scripts

      - name: Publish release (GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
          TARBALL: ${{ runner.temp }}/opencode-vpet-package/${{ steps.pack.outputs.tarball_name }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            "$TARBALL" \
            --title "v$RELEASE_VERSION" \
            --generate-notes

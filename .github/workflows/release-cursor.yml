name: Release Cursor Digital Pet

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for a new release (ignored when retry_tag is set)
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
      retry_tag:
        description: Existing Cursor release tag to retry (for example cursor-digital-pet-v0.2.0)
        required: false
        type: string
      retry_target:
        description: Destination to retry when retry_tag is set
        required: false
        type: choice
        options:
          - github
          - openvsx
      bootstrap_openvsx:
        description: Use the first-release Open VSX PAT when retrying its tag
        required: false
        type: boolean
        default: false

concurrency:
  group: digital-pet-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Publish Cursor Digital Pet
    if: github.repository == 'jcendal/digital-pet'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate new release or retry
        id: mode
        env:
          DISPATCH_REF: ${{ github.ref }}
          BUMP: ${{ inputs.bump }}
          RETRY_TAG: ${{ inputs.retry_tag }}
          RETRY_TARGET: ${{ inputs.retry_target }}
          BOOTSTRAP_INPUT: ${{ inputs.bootstrap_openvsx }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if [[ -n "$RETRY_TAG" ]]; then
            [[ "$RETRY_TAG" =~ ^cursor-digital-pet-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            case "$RETRY_TARGET" in github|openvsx) ;; *) exit 1 ;; esac
            git show-ref --verify --quiet "refs/tags/$RETRY_TAG"
            git merge-base --is-ancestor "$RETRY_TAG^{commit}" refs/remotes/origin/main
            git checkout --detach "$RETRY_TAG"
            release_version="${RETRY_TAG#cursor-digital-pet-v}"
            test "$(node -p 'require("./packages/cursor-digital-pet/package.json").version')" = "$release_version"
            printf 'retry=true\nrelease_version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
            bootstrap_openvsx="$BOOTSTRAP_INPUT"
          else
            [[ "$BUMP" =~ ^(patch|minor|major)$ ]]
            test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
            printf 'retry=false\n' >> "$GITHUB_OUTPUT"
            if [ -z "$(git tag --list 'cursor-digital-pet-v*')" ]; then
              bootstrap_openvsx=true
            else
              bootstrap_openvsx=false
            fi
          fi
          printf 'bootstrap_openvsx=%s\n' "$bootstrap_openvsx" >> "$GITHUB_OUTPUT"

      - name: Verify first-release Open VSX credential
        if: steps.mode.outputs.bootstrap_openvsx == 'true' && (steps.mode.outputs.retry != 'true' || inputs.retry_target == 'openvsx')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo 'Configure the temporary OVSX_PAT repository secret for the first Open VSX release.' >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: npm ci

      - name: Prepare release metadata
        if: steps.mode.outputs.retry != 'true'
        id: metadata
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          release_date="$(date -u +%F)"
          git tag --list | node --experimental-strip-types scripts/release-metadata.ts \
            --package-json packages/cursor-digital-pet/package.json \
            --changelog packages/cursor-digital-pet/CHANGELOG.md \
            --tag-prefix cursor-digital-pet-v \
            --bump "$BUMP" \
            --date "$release_date"

      - name: Update lockfile
        if: steps.mode.outputs.retry != 'true'
        run: npm install --package-lock-only --ignore-scripts

      - name: Run release checks
        run: |
          npm run check
          npm run test --workspace cursor-digital-pet

      - name: Build cursor-digital-pet
        run: npm run build --workspace cursor-digital-pet

      - name: Pack VSIX
        id: vsix
        run: |
          set -euo pipefail
          vsix_path="$RUNNER_TEMP/cursor-digital-pet.vsix"
          cd packages/cursor-digital-pet
          npx @vscode/vsce package --no-dependencies -o "$vsix_path"
          printf 'vsix_path=%s\n' "$vsix_path" >> "$GITHUB_OUTPUT"

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and tag release
        if: steps.mode.outputs.retry != 'true'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
        run: |
          set -euo pipefail
          git add packages/cursor-digital-pet/package.json packages/cursor-digital-pet/CHANGELOG.md package-lock.json
          git commit -m "chore(cursor release): v$RELEASE_VERSION"
          git tag -a "cursor-digital-pet-v$RELEASE_VERSION" -m "Cursor Digital Pet v$RELEASE_VERSION"

      - name: Commit next version
        if: steps.mode.outputs.retry != 'true'
        env:
          NEXT_DEV_VERSION: ${{ steps.metadata.outputs.next_dev_version }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/release-metadata.ts set-package-version packages/cursor-digital-pet/package.json "$NEXT_DEV_VERSION"
          npm install --package-lock-only --ignore-scripts
          git add packages/cursor-digital-pet/package.json package-lock.json
          git commit -m "chore(cursor): bump v$NEXT_DEV_VERSION"

      - name: Push release
        if: steps.mode.outputs.retry != 'true'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/cursor-digital-pet-v$RELEASE_VERSION"

      - name: Publish release (GitHub)
        if: steps.mode.outputs.retry != 'true' || inputs.retry_target == 'github'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version || steps.mode.outputs.release_version }}
        run: |
          node --experimental-strip-types scripts/release-metadata.ts release-notes packages/cursor-digital-pet/CHANGELOG.md "$RELEASE_VERSION" > "$RUNNER_TEMP/cursor-release-notes.md"
          if gh release view "cursor-digital-pet-v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "cursor-digital-pet-v$RELEASE_VERSION" \
              "${{ steps.vsix.outputs.vsix_path }}" --clobber
          else
            gh release create "cursor-digital-pet-v$RELEASE_VERSION" \
              "${{ steps.vsix.outputs.vsix_path }}" \
              --title "Cursor Digital Pet v$RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/cursor-release-notes.md"
          fi

      - name: Publish release (Open VSX via OIDC)
        if: steps.mode.outputs.bootstrap_openvsx != 'true' && (steps.mode.outputs.retry != 'true' || inputs.retry_target == 'openvsx')
        run: npx ovsx publish "${{ steps.vsix.outputs.vsix_path }}" --trusted-publishing

      - name: Publish first release (Open VSX via PAT)
        if: steps.mode.outputs.bootstrap_openvsx == 'true' && (steps.mode.outputs.retry != 'true' || inputs.retry_target == 'openvsx')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "${{ steps.vsix.outputs.vsix_path }}"

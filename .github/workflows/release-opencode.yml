name: Release OpenCode Digital Pet

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for a new release (ignored when retry_tag is set)
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
      retry_tag:
        description: Existing OpenCode release tag to retry (for example opencode-digital-pet-v0.2.0)
        required: false
        type: string
      retry_target:
        description: Registry to retry when retry_tag is set
        required: false
        type: choice
        options:
          - npm
          - github

concurrency:
  group: digital-pet-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Publish OpenCode Digital Pet
    if: github.repository == 'jcendal/digital-pet'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate new release or retry
        id: mode
        env:
          DISPATCH_REF: ${{ github.ref }}
          BUMP: ${{ inputs.bump }}
          RETRY_TAG: ${{ inputs.retry_tag }}
          RETRY_TARGET: ${{ inputs.retry_target }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if [[ -n "$RETRY_TAG" ]]; then
            [[ "$RETRY_TAG" =~ ^opencode-digital-pet-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$RETRY_TARGET" = "npm" || test "$RETRY_TARGET" = "github"
            git show-ref --verify --quiet "refs/tags/$RETRY_TAG"
            git merge-base --is-ancestor "$RETRY_TAG^{commit}" refs/remotes/origin/main
            git checkout --detach "$RETRY_TAG"
            release_version="${RETRY_TAG#opencode-digital-pet-v}"
            test "$(node -p 'require("./packages/opencode-digital-pet/package.json").version')" = "$release_version"
            printf 'retry=true\nrelease_version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
          else
            [[ "$BUMP" =~ ^(patch|minor|major)$ ]]
            test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
            printf 'retry=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: npm ci

      - name: Prepare release metadata
        if: steps.mode.outputs.retry != 'true'
        id: metadata
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          release_date="$(date -u +%F)"
          git tag --list | node --experimental-strip-types scripts/release-metadata.ts \
            --package-json packages/opencode-digital-pet/package.json \
            --changelog packages/opencode-digital-pet/CHANGELOG.md \
            --tag-prefix opencode-digital-pet-v \
            --legacy-tag-prefix v \
            --bump "$BUMP" \
            --date "$release_date"

      - name: Update lockfile
        if: steps.mode.outputs.retry != 'true'
        run: |
          npm install --package-lock-only --ignore-scripts

      - name: Run release checks
        run: npm run release:check

      - name: Pack release
        id: pack
        run: |
          set -euo pipefail
          package_directory="$RUNNER_TEMP/opencode-digital-pet-package"
          mkdir -p "$package_directory"

          tarball_name="$(npm pack --loglevel silent \
            --pack-destination "$package_directory" \
            --workspace @jcendal/opencode-digital-pet)"

          test -f "$package_directory/$tarball_name"

          printf 'tarball_name=%s\n' "$tarball_name" >> "$GITHUB_OUTPUT"

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and tag release
        if: steps.mode.outputs.retry != 'true'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
        run: |
          set -euo pipefail

          git add packages/opencode-digital-pet/package.json packages/opencode-digital-pet/CHANGELOG.md package-lock.json

          git commit -m "chore(opencode release): v$RELEASE_VERSION"

          git tag -a "opencode-digital-pet-v$RELEASE_VERSION" -m "OpenCode Digital Pet v$RELEASE_VERSION"

      - name: Commit next version
        if: steps.mode.outputs.retry != 'true'
        env:
          NEXT_DEV_VERSION: ${{ steps.metadata.outputs.next_dev_version }}
        run: |
          set -euo pipefail

          node --experimental-strip-types scripts/release-metadata.ts set-package-version packages/opencode-digital-pet/package.json "$NEXT_DEV_VERSION"
          npm install --package-lock-only --ignore-scripts

          git add packages/opencode-digital-pet/package.json package-lock.json

          git commit -m "chore(opencode): bump v$NEXT_DEV_VERSION"

      - name: Push release
        if: steps.mode.outputs.retry != 'true'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/opencode-digital-pet-v$RELEASE_VERSION"

      - name: Publish release (npm)
        if: steps.mode.outputs.retry != 'true' || inputs.retry_target == 'npm'
        env:
          TARBALL: ${{ runner.temp }}/opencode-digital-pet-package/${{ steps.pack.outputs.tarball_name }}
        run: |
          set -euo pipefail

          npm_version="$(npm --version)"

          NPM_VERSION="$npm_version" node --input-type=module <<'NODE'
          const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number);
          if (
            major < 11 ||
            (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))
          ) {
            throw new Error(`npm ${process.env.NPM_VERSION} is below required version 11.5.1`);
          }
          NODE

          npm publish "$TARBALL" \
            --access public --provenance --ignore-scripts

      - name: Publish release (GitHub)
        if: steps.mode.outputs.retry != 'true' || inputs.retry_target == 'github'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version || steps.mode.outputs.release_version }}
          TARBALL: ${{ runner.temp }}/opencode-digital-pet-package/${{ steps.pack.outputs.tarball_name }}
        run: |
          node --experimental-strip-types scripts/release-metadata.ts release-notes packages/opencode-digital-pet/CHANGELOG.md "$RELEASE_VERSION" > "$RUNNER_TEMP/opencode-release-notes.md"
          if gh release view "opencode-digital-pet-v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "opencode-digital-pet-v$RELEASE_VERSION" "$TARBALL" --clobber
          else
            gh release create "opencode-digital-pet-v$RELEASE_VERSION" \
              "$TARBALL" \
              --title "OpenCode Digital Pet v$RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/opencode-release-notes.md"
          fi

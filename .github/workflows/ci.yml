name: Validate monorepo

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check, test and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, lint and types
        run: npm run check

      - name: Run unit tests
        run: npm run test

      - name: Run persistence tests
        run: npm run test:persistence

      - name: Inspect npm package
        run: npm pack --workspace @jcendal/opencode-digital-pet --dry-run --json

      - name: Package Cursor VSIX
        working-directory: packages/cursor-digital-pet
        run: npx @vscode/vsce package --no-dependencies
